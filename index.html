<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TTS Informatika Kelas 8 - Bab 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef4ff,#f8fbff);color:#172033}
.container{max-width:1200px;margin:auto;padding:22px}
header{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #00000012;margin-bottom:18px}
h1{margin:0 0 8px;font-size:28px}.subtitle{color:#5d6b82;margin:0}
.topbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;align-items:center}
input.name{padding:12px 14px;border:1px solid #ccd5e2;border-radius:10px;font-size:15px;min-width:220px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.check{background:#2563eb;color:white}.reset{background:#e8edf5;color:#172033}.reveal{background:#f59e0b;color:#fff}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.stat{background:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 5px 18px #0000000c}
.main{display:grid;grid-template-columns:minmax(420px,1fr) minmax(320px,1fr);gap:18px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px #00000012}
.board-wrap{overflow:auto;text-align:center}
#board{border-collapse:collapse;margin:8px auto;background:#111827}
#board td{width:34px;height:34px;border:1px solid #9aa5b5;position:relative;padding:0}
#board td.black{background:#111827;border-color:#111827}
#board td.white{background:#fff}
#board input{width:100%;height:100%;border:0;text-align:center;font-size:18px;font-weight:bold;text-transform:uppercase;outline:0;background:transparent}
#board input:focus{background:#dbeafe}
.num{position:absolute;left:2px;top:1px;font-size:9px;font-weight:bold;color:#334155;z-index:2;pointer-events:none}
.correct{background:#dcfce7!important}.wrong{background:#fee2e2!important}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:18px}
h2{font-size:19px;margin-top:0}ol{padding-left:24px;margin-bottom:0}li{margin:0 0 10px;line-height:1.35;cursor:pointer}li:hover{color:#2563eb}
.result{margin-top:15px;padding:14px;border-radius:12px;background:#eef6ff;display:none}
footer{text-align:center;color:#718096;font-size:13px;margin:18px}
@media(max-width:850px){.main{grid-template-columns:1fr}.clues{grid-template-columns:1fr}.container{padding:12px}#board td{width:29px;height:29px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>🧩 TTS Informatika Kelas 8</h1>
<p class="subtitle"><b>BAB 2 — Berpikir Komputasional</b></p>
<div class="topbar">
<input class="name" id="studentName" placeholder="Masukkan nama siswa">
<button class="check" onclick="checkAnswers()">✓ Cek Jawaban</button>
<button class="reveal" onclick="revealAnswers()">💡 Tampilkan Jawaban</button>
<button class="reset" onclick="resetGame()">↻ Mulai Ulang</button>
</div>
</header>

<div class="stats">
<div class="stat">👤 Siswa: <b id="showName">-</b></div>
<div class="stat">⏱️ Waktu: <b id="timer">00:00</b></div>
<div class="stat">🎯 Skor: <b id="score">0</b>/100</div>
<div class="stat">📝 Terisi: <b id="filled">0</b>/23</div>
</div>

<div class="main">
<section class="card">
<h2>🧩 Kotak Teka-Teki Silang</h2>
<div class="board-wrap"><table id="board"></table></div>
<div id="result" class="result"></div>
</section>

<section class="card">
<div class="clues">
<div>
<h2>➡️ Mendatar</h2>
<ol id="across"></ol>
</div>
<div>
<h2>⬇️ Menurun</h2>
<ol id="down"></ol>
</div>
</div>
</section>
</div>

<footer>TTS Informatika Kelas 8 • Bab 2 Berpikir Komputasional</footer>
</div>

<script>
const entries=[
["KOMPUTASIONAL","Cara berpikir untuk menyelesaikan masalah secara sistematis, logis, dan efisien disebut berpikir ...","across"],
["FUNGSI","Hubungan antara masukan dan keluaran dalam matematika dan informatika disebut ...","down"],
["INPUT","Data yang diberikan kepada suatu fungsi disebut ...","across"],
["OUTPUT","Hasil yang diperoleh dari suatu fungsi disebut ...","down"],
["HIMPUNAN","Kumpulan objek yang didefinisikan secara jelas disebut ...","across"],
["BINER","Sistem bilangan yang menggunakan basis 2 disebut bilangan ...","down"],
["DESIMAL","Sistem bilangan yang menggunakan basis 10 disebut bilangan ...","across"],
["OKTAL","Sistem bilangan yang menggunakan basis 8 disebut bilangan ...","down"],
["HEKSADESIMAL","Sistem bilangan yang menggunakan basis 16 disebut ...","across"],
["NOL","Dalam sistem biner, keadaan mati biasanya dilambangkan dengan angka ...","down"],
["SATU","Dalam sistem biner, keadaan nyala biasanya dilambangkan dengan angka ...","across"],
["SATU","Bilangan biner menggunakan dua simbol utama, yaitu 0 dan ...","down"],
["1011","Bilangan 11 dalam desimal jika diubah ke biner adalah ...","across"],
["1101","Bilangan 13 dalam desimal jika diubah ke biner adalah ...","down"],
["101","Bilangan 65 dalam desimal jika diubah ke oktal adalah ...","across"],
["TIGABELAS","Bilangan biner 1101 jika diubah ke desimal menghasilkan ...","down"],
["SERATUSSEBELAS","Bilangan oktal 157 jika diubah ke desimal menghasilkan ...","across"],
["ALGORITMA","Urutan langkah logis dan sistematis untuk menyelesaikan masalah disebut ...","down"],
["PANASKAN","Dalam algoritma membuat mi instan, langkah pertama adalah ... air","across"],
["STRUKTURDATA","Cara menyimpan dan mengorganisasi data dalam komputer disebut ...","down"],
["ARRAY","Struktur data berupa kumpulan data yang tersusun secara berurutan disebut ...","across"],
["LIST","Struktur data Python yang fleksibel dan dapat diubah ukurannya disebut ...","down"],
["SET","Struktur data yang menyimpan himpunan data tanpa duplikasi disebut ...","across"]
];

// Fixed compact crossword layout generated by placing words greedily with crossings.
function buildGrid(words){
 let cells={};
 let placements=[];
 function key(r,c){return r+","+c}
 function tryPlace(word,dir,r,c){
   for(let i=0;i<word.length;i++){
     let rr=r+(dir==="down"?i:0), cc=c+(dir==="across"?i:0);
     let k=key(rr,cc), old=cells[k];
     if(old && old.ch!==word[i]) return false;
     // no touching parallel words unless crossing
     let neighbors=dir==="across" ? [[rr-1,cc],[rr+1,cc]] : [[rr,cc-1],[rr,cc+1]];
     for(const [nr,nc] of neighbors){
       let x=cells[key(nr,nc)];
       if(x && (!old || nr!==rr || nc!==cc)) return false;
     }
   }
   return true;
 }
 function place(word,dir,r,c){
   for(let i=0;i<word.length;i++){
     let rr=r+(dir==="down"?i:0),cc=c+(dir==="across"?i:0);
     cells[key(rr,cc)]={ch:word[i],ids:((cells[key(rr,cc)]?.ids)||[]).concat(i)};
   }
   placements.push({r,c,dir,word});
 }
 // first word
 place(words[0], "across", 12, 2);
 for(let wi=1;wi<words.length;wi++){
   let w=words[wi], best=null;
   for(const p of placements){
     for(let i=0;i<w.length;i++){
       for(let j=0;j<p.word.length;j++){
         if(w[i]!==p.word[j]) continue;
         let dir=p.dir==="across"?"down":"across";
         let r=p.r+(p.dir==="down"?j:0)-(dir==="down"?i:0);
         let c=p.c+(p.dir==="across"?j:0)-(dir==="across"?i:0);
         if(tryPlace(w,dir,r,c)){best={r,c,dir};break}
       }
       if(best)break;
     }
     if(best)break;
   }
   if(!best){
     // fallback: put below with spacing, maintaining a valid separate segment
     let r=12+wi*2,c=2;
     if(w.length<15 && tryPlace(w,"across",r,c)) best={r,c,dir:"across"};
     else best={r:wi*2,c:20,dir:"down"};
   }
   place(w,best.dir,best.r,best.c);
 }
 let rs=Object.keys(cells).map(k=>+k.split(",")[0]), cs=Object.keys(cells).map(k=>+k.split(",")[1]);
 let minR=Math.min(...rs),minC=Math.min(...cs),maxR=Math.max(...rs),maxC=Math.max(...rs.map(()=>0),...cs);
 // normalize
 placements=placements.map(p=>({...p,r:p.r-minR,c:p.c-minC}));
 let grid={};
 for(const p of placements) for(let i=0;i<p.word.length;i++){
   let r=p.r+(p.dir==="down"?i:0),c=p.c+(p.dir==="across"?i:0);
   grid[key(r,c)]={ch:p.word[i], ids: (grid[key(r,c)]?.ids||[]).concat(placements.indexOf(p))};
 }
 let height=Math.max(...Object.keys(grid).map(k=>+k.split(",")[0]))+1;
 let width=Math.max(...Object.keys(grid).map(k=>+k.split(",")[1]))+1;
 return {grid,placements,height,width};
}
const crossword=buildGrid(entries.map(e=>e[0]));
const board=document.getElementById("board");
let cellInputs={};
let wordNumber={};

function starts(){
 let n=1;
 for(let i=0;i<crossword.placements.length;i++){
   let p=crossword.placements[i], key=(p.r)+","+(p.c);
   if(wordNumber[key]===undefined) wordNumber[key]=n++;
 }
}
starts();

function render(){
 for(let r=0;r<crossword.height;r++){
   let tr=document.createElement("tr");
   for(let c=0;c<crossword.width;c++){
     let td=document.createElement("td"), k=r+","+c, cell=crossword.grid[k];
     if(!cell){td.className="black";tr.appendChild(td);continue}
     td.className="white";
     let startsHere=wordNumber[k];
     if(startsHere!==undefined){let s=document.createElement("span");s.className="num";s.textContent=startsHere;td.appendChild(s)}
     let inp=document.createElement("input");
     inp.maxLength=1;inp.dataset.answer=cell.ch;inp.dataset.key=k;
     inp.addEventListener("input",e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(-1);updateStats()});
     inp.addEventListener("keydown",e=>{
       if(e.key==="ArrowRight") move(r,c+1);
       if(e.key==="ArrowLeft") move(r,c-1);
       if(e.key==="ArrowDown") move(r+1,c);
       if(e.key==="ArrowUp") move(r-1,c);
     });
     td.appendChild(inp);cellInputs[k]=inp;tr.appendChild(td);
   }
   board.appendChild(tr);
 }
}
function move(r,c){let i=cellInputs[r+","+c];if(i)i.focus()}
function makeClues(id,dir){
 let list=document.getElementById(id);
 crossword.placements.forEach((p,i)=>{
   if(p.dir!==dir)return;
   let li=document.createElement("li"), num=wordNumber[p.r+","+p.c];
   li.innerHTML="<b>"+num+".</b> "+entries[i][1];
   li.onclick=()=>move(p.r,p.c);list.appendChild(li);
 });
}
render(); makeClues("across","across"); makeClues("down","down");

function updateStats(){
 let vals=Object.values(cellInputs), filled=vals.filter(x=>x.value).length;
 document.getElementById("filled").textContent=filled;
}
function checkAnswers(){
 let correct=0,total=0;
 Object.values(cellInputs).forEach(i=>{
   total++;
   i.classList.remove("correct","wrong");
   if(i.value){
     if(i.value===i.dataset.answer){correct++;i.classList.add("correct")}
     else i.classList.add("wrong");
   }
 });
 let score=Math.round(correct/total*100);
 document.getElementById("score").textContent=score;
 let result=document.getElementById("result");
 result.style.display="block";
 result.innerHTML="🎯 <b>"+correct+" dari "+total+" kotak benar.</b> Skor: <b>"+score+"/100</b>";
 if(correct===total) result.innerHTML+="<br>🎉 Selamat! Semua jawaban benar.";
}
function revealAnswers(){
 Object.values(cellInputs).forEach(i=>{i.value=i.dataset.answer;i.classList.remove("wrong");i.classList.add("correct")});
 updateStats();document.getElementById("score").textContent="100";
 document.getElementById("result").style.display="block";
 document.getElementById("result").innerHTML="💡 Semua jawaban telah ditampilkan.";
}
function resetGame(){
 Object.values(cellInputs).forEach(i=>{i.value="";i.className=""});
 document.getElementById("score").textContent="0";
 document.getElementById("result").style.display="none";
 updateStats(); seconds=0;
}
document.getElementById("studentName").addEventListener("input",e=>document.getElementById("showName").textContent=e.target.value||"-");
let seconds=0;
setInterval(()=>{seconds++;let m=String(Math.floor(seconds/60)).padStart(2,"0"),s=String(seconds%60).padStart(2,"0");document.getElementById("timer").textContent=m+":"+s},1000);
</script>
</body>
</html>
